[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gigasatlas"
version = "0.1.0"
description = "Name cells of new Pacific oyster (Magallana gigas) single-cell data with a harmonised multi-tissue atlas"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.21", "pandas>=1.3", "scipy>=1.7", "anndata>=0.8"]

[project.urls]
Homepage = "https://dndn0254.github.io/gigas-atlas/"
Source = "https://github.com/dndn0254/gigasatlas"

[project.optional-dependencies]
train = ["scikit-learn>=1.0"]
test = ["pytest", "scikit-learn>=1.0"]

[project.scripts]
gigasatlas = "gigasatlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gigasatlas = ["data/*.tsv", "data/*.tsv.gz", "data/models/*.npz", "data/examples/*"]
